name: Hermes package / rolling nightly

# Register this workflow on the default branch so workflow_dispatch can
# select the actual packaging workflow from the hermes branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-hermes-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Select the Hermes branch
        run: |
          echo '::error::Select the hermes branch when running this workflow.'
          exit 1
